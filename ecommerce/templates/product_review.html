{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Đánh giá sản phẩm: {{ product.name }}</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="rating" class="form-label">Đánh giá:</label>
                            <select class="form-select" id="rating" name="rating" required>
                                <option value="">Chọn số sao</option>
                                <option value="1" {% if review and review.rating == 1 %}selected{% endif %}>1 sao</option>
                                <option value="2" {% if review and review.rating == 2 %}selected{% endif %}>2 sao</option>
                                <option value="3" {% if review and review.rating == 3 %}selected{% endif %}>3 sao</option>
                                <option value="4" {% if review and review.rating == 4 %}selected{% endif %}>4 sao</option>
                                <option value="5" {% if review and review.rating == 5 %}selected{% endif %}>5 sao</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="comment" class="form-label">Nhận xét:</label>
                            <textarea class="form-control" id="comment" name="comment" rows="4" required>{% if review %}{{ review.comment }}{% endif %}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'product_detail' product.id %}" class="btn btn-secondary">Quay lại</a>
                            <button type="submit" class="btn btn-primary">
                                {% if review %}Cập nhật đánh giá{% else %}Gửi đánh giá{% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
