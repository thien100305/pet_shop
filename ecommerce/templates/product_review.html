{% extends 'base.html' %}{% block title %}Đánh giá {{ product.name }} | PetHouse{% endblock %}{% block content %}<section class="section"><div class="container" style="max-width:700px"><div class="section-heading"><div><span class="eyebrow">Đánh giá sản phẩm</span><h1>{{ product.name }}</h1></div></div><form method="post" class="panel">{% csrf_token %}<div class="form-group"><label for="rating">Số sao</label><select id="rating" name="rating" required>{% for value in '54321' %}<option value="{{ value }}" {% if review.rating|stringformat:'s' == value %}selected{% endif %}>{{ value }} sao</option>{% endfor %}</select></div><div class="form-group"><label for="comment">Nhận xét</label><textarea id="comment" name="comment" rows="5" required>{% if review %}{{ review.comment }}{% endif %}</textarea></div><div class="actions"><button class="btn btn-primary">Lưu đánh giá</button><a class="btn btn-outline" href="{% url 'product_detail' product.id %}">Hủy</a></div></form></div></section>{% endblock %}
