{% extends 'admin/base.html' %}
{% block admin_title %}Sửa tài khoản khách hàng{% endblock %}
{% block admin_content %}
<div class="section-heading"><div><span class="eyebrow">Khách hàng</span><h1>Sửa tài khoản {{ customer.username }}</h1></div><a class="btn btn-outline" href="{% url 'admin_users' %}"><i class="fa-solid fa-arrow-left"></i> Quay lại</a></div>
<form class="panel admin-form" method="post">{% csrf_token %}
  {% for field in form %}<div class="form-group"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
  <div class="actions mt-2"><button class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu tài khoản</button><a class="btn btn-outline" href="{% url 'admin_users' %}">Hủy</a></div>
</form>
{% endblock %}
