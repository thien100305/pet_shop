{% extends 'base.html' %}{% block title %}Đánh giá đơn hàng | PetHouse{% endblock %}{% block content %}<section class="section"><div class="container" style="max-width:820px"><div class="section-heading"><div><span class="eyebrow">Đơn hàng #{{ order.id }}</span><h1>Chia sẻ trải nghiệm</h1></div></div><form method="post">{% csrf_token %}{% for item in order.items.all %}<div class="panel" style="margin-bottom:1rem"><div class="row-between"><h3>{{ item.product.name }}</h3><span class="price">{{ item.price|floatformat:0 }} đ</span></div><div class="form-group"><label for="rating_{{ item.id }}">Số sao</label><select id="rating_{{ item.id }}" name="rating_{{ item.id }}" required><option value="">Chọn mức đánh giá</option><option value="5">5 - Tuyệt vời</option><option value="4">4 - Tốt</option><option value="3">3 - Bình thường</option><option value="2">2 - Chưa tốt</option><option value="1">1 - Không hài lòng</option></select></div><div class="form-group"><label for="comment_{{ item.id }}">Nhận xét</label><textarea id="comment_{{ item.id }}" name="comment_{{ item.id }}" rows="3" required></textarea></div></div>{% endfor %}<button class="btn btn-primary">Gửi đánh giá</button></form></div></section>{% endblock %}
