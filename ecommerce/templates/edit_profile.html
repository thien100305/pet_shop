{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa thông tin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .nav-main {
            background-color: #2c6ebb;
            padding: 15px;
        }
        .nav-main .navbar-brand img {
            height: 40px;
        }
        .nav-main .nav-link {
            color: white !important;
        }
        .profile-section {
            padding: 40px 0;
        }
        .profile-form {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg nav-main">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'images/pic.jpg' %}" alt="Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Trang chủ</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <div class="cart-section me-3">
                            <a href="{% url 'cart' %}" class="text-white">
                                <i class="fas fa-shopping-cart"></i>
                                <span class="badge bg-danger">{{ cart_count }}</span>
                            </a>
                        </div>
                        <a href="{% url 'profile' %}" class="btn btn-outline-light me-2">Profile</a>
                        <a href="{% url 'logout' %}" class="btn btn-outline-light">Đăng xuất</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Đăng nhập</a>
                        <a href="{% url 'register' %}" class="btn btn-light">Đăng ký</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Edit Profile Section -->
    <section class="profile-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="profile-form">
                        <h3 class="mb-4">Edit Profile</h3>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phone" name="phone" value="{{ user_profile.phone }}">
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" name="address" rows="3">{{ user_profile.address }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" id="city" name="city" value="{{ user_profile.city }}">
                            </div>
                            <div class="mb-3">
                                <label for="country" class="form-label">Country</label>
                                <input type="text" class="form-control" id="country" name="country" value="{{ user_profile.country }}">
                            </div>
                            <div class="mb-3">
                                <label for="postal_code" class="form-label">Postal Code</label>
                                <input type="text" class="form-control" id="postal_code" name="postal_code" value="{{ user_profile.postal_code }}">
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'profile' %}" class="btn btn-secondary">Back to Profile</a>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
