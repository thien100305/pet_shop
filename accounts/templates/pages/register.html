{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .nav { background-color: #2c6ebb; padding: 15px; display: flex; align-items: center; }
        .nav a { color: white; text-decoration: none; margin-right: 20px; line-height: 40px; }
        .logo { height: 40px; margin-right: 20px; }
        .container { max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-box { background: white; padding: 30px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,.1); }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 10px; background-color: #2c6ebb; color: white; border: 0; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .submit-btn:hover { background-color: #218838; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #007bff; text-decoration: none; font-size: 14px; }
        .links a:hover { text-decoration: underline; }
        .errorlist { color: #721c24; background: #f8d7da; padding: 8px 12px 8px 28px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="{% url 'home' %}"><img src="{% static 'images/pic.jpg' %}" alt="PetHouse" class="logo"></a>
        <div class="nav-links">
            <a href="{% url 'login' %}">Đăng Nhập</a>
            <a href="{% url 'register' %}">Đăng Ký</a>
        </div>
    </div>

    <div class="container">
        <div class="form-box">
            <h2>Đăng ký tài khoản</h2>
            {{ form.non_field_errors }}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Tên đăng nhập</label>
                    <input type="text" id="id_username" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required>
                    {{ form.username.errors }}
                </div>
                <div class="form-group">
                    <label for="id_email">Email</label>
                    <input type="email" id="id_email" name="email" value="{{ form.email.value|default:'' }}" autocomplete="email" required>
                    {{ form.email.errors }}
                </div>
                <div class="form-group">
                    <label for="id_password1">Mật khẩu</label>
                    <input type="password" id="id_password1" name="password1" autocomplete="new-password" required>
                    {{ form.password1.errors }}
                </div>
                <div class="form-group">
                    <label for="id_password2">Xác nhận mật khẩu</label>
                    <input type="password" id="id_password2" name="password2" autocomplete="new-password" required>
                    {{ form.password2.errors }}
                </div>
                <button type="submit" class="submit-btn">Hoàn tất</button>
                <div class="links"><p>Bạn đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p></div>
            </form>
        </div>
    </div>
</body>
</html>
